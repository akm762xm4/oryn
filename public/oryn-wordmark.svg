<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" viewBox="6.5 16.5 278.27 97.5"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Oryn Full Wordmark</title>
  <defs>
    <linearGradient id="g-gold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4820a"/>
    </linearGradient>
    <linearGradient id="g-txt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c97d0a"/>
    </linearGradient>
  </defs>

  <!-- Icon mark: r=42, circumference≈264
       305° arc = 224; gap = 40; offset=-66 -->
  <circle cx="55" cy="65" r="42" fill="none" stroke="url(#g-gold)" stroke-width="13" stroke-linecap="round" stroke-dasharray="224 40" stroke-dashoffset="-66"/>

  <!-- Tail knob -->
  <circle cx="28" cy="97" r="5.5" fill="url(#g-gold)"/>
  <circle cx="28" cy="97" r="2.2" fill="#fef3c7" opacity="0.65"/>

  <!-- "Oryn" text -->
  <text x="113" y="97" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="78" font-weight="700" fill="url(#g-txt)" letter-spacing="-1.5">Oryn</text>
</svg>