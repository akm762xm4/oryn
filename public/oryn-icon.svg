<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Oryn Icon Mark</title>
  <defs>
    <linearGradient id="g-gold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d4820a"/>
    </linearGradient>
  </defs>

  <!-- Main ring: r=72, circumference≈452
       305° arc = 383; gap = 69
       dashoffset=-114 starts arc from top-right -->
  <circle cx="100" cy="100" r="72"
    fill="none"
    stroke="url(#g-gold)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-dasharray="383 69"
    stroke-dashoffset="-114"/>

  <!-- Tail knob -->
  <circle cx="54" cy="155" r="9" fill="url(#g-gold)"/>
  <circle cx="54" cy="155" r="3.5" fill="#fef3c7" opacity="0.65"/>
</svg>
